# Publishes demo/site/ (the Nandinī website) to GitHub Pages. Enable Pages with "GitHub Actions" as the source.
name: website
on:
  push:
    branches: [main]
    paths: ["demo/site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  # Two jobs, as in GitHub's starter workflow: deploying in the job that uploaded the artifact sometimes failed with
  # "No artifacts named github-pages" because the artifact was not listed yet.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: demo/site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
